name: 自动合并修复并收尾（triage 分支推送触发）

# 触发时机：本流程把修复推到 triage/* 分支时（一晚一个批次分支，可含多个提交）。
# 动作：squash 合并进 main → 发一个 patch 版本 → 回复并关闭分支里提到的所有 issue。
# 不建 PR（GitHub 默认禁止 Actions 自建 PR），直接本地 squash 合并后 push main。

on:
  push:
    branches: ["triage/**"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: auto-finalize
  cancel-in-progress: false

jobs:
  ship:
    if: "!contains(github.event.head_commit.message, '[skip-finalize]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: squash 合并进 main
        id: merge
        run: |
          set -e
          BRANCH="${GITHUB_REF#refs/heads/}"
          git fetch origin main --quiet
          git checkout -B main "origin/main" --quiet

          # 分支上相对 main 的所有提交标题（一个 issue 一条）
          git log --reverse --format=%s "origin/main..origin/${BRANCH}" > /tmp/subjects.txt
          [ -s /tmp/subjects.txt ] || { echo "分支没有提交，退出"; exit 0; }
          cat /tmp/subjects.txt

          # 汇总 issue 号与合并提交标题
          ISSUES=$(grep -oE '#[0-9]+' /tmp/subjects.txt | sort -u | tr '\n' ' ' || true)
          echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"
          head -1 /tmp/subjects.txt > /tmp/title.txt
          { echo "$(head -1 /tmp/subjects.txt)"; echo; sed 's/^/- /' /tmp/subjects.txt; } > /tmp/msg.txt

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --squash "origin/${BRANCH}" >/dev/null
          if git diff --cached --quiet; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "没有实际改动，跳过"
          else
            git commit -F /tmp/msg.txt --quiet
            git push origin main --quiet
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "已合并：$ISSUES"
          fi
          git push origin --delete "$BRANCH" >/dev/null 2>&1 || true

      - name: 计算版本号
        if: steps.merge.outputs.merged == 'true'
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          prev=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          case "$prev" in
            v[0-9]*.[0-9]*.[0-9]*)
              rest=${prev#v}; major=${rest%%.*}; t=${rest#*.}; minor=${t%%.*}; patch=${t##*.}
              next="v${major}.${minor}.$((patch+1))" ;;
            *) next="v1.0.1" ;;
          esac
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: 发新版本（源码 tag，不含 exe）
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          next='${{ steps.ver.outputs.next }}'
          gh release view "$next" >/dev/null 2>&1 && { echo "$next 已存在，跳过"; exit 0; }
          { echo "## 本次更新"; echo; sed 's/^/- /' /tmp/subjects.txt; echo;
            echo "源码包由 GitHub 自动生成；本次发行不含重新打包的 exe。"; } > /tmp/notes.md
          gh release create "$next" --target main --title "$next" --notes-file /tmp/notes.md </dev/null

      - name: 回复并关闭对应 issue
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          issues='${{ steps.merge.outputs.issues }}'
          [ -n "$issues" ] || { echo "没有 issue 号，跳过"; exit 0; }
          marker="自动修复已合入 main"
          for n in $issues; do
            num="${n#\#}"
            [ -z "$num" ] && continue
            gh issue comment "$num" --body "$marker，改动已随自动版本发布，本 issue 一并关闭。" </dev/null || true
            gh issue close "$num" --reason completed </dev/null || true
          done
