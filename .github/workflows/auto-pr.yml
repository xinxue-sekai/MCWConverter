name: 自动合并修复并收尾（triage 分支推送触发）

# 触发时机：本流程把修复推到 triage/* 分支时。
# 动作：squash 合并进 main → 发下一个源码版本 → 回复并关闭对应 issue。
# 不建 PR（GitHub 默认禁止 Actions 自建 PR），直接本地 squash 合并后 push main。
# commit 标题必须含 (#<issue号>)，否则不会回 issue、也不会关 issue。

on:
  push:
    branches: ["triage/**"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: auto-finalize
  cancel-in-progress: false

jobs:
  ship:
    if: "!contains(github.event.head_commit.message, '[skip-finalize]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: squash 合并进 main
        id: merge
        run: |
          set -e
          BRANCH="${GITHUB_REF#refs/heads/}"
          SUBJECT="$(git log -1 --format=%s)"
          echo "branch=$BRANCH"
          echo "title=$SUBJECT" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --quiet
          git checkout -B main "origin/main" --quiet
          git merge --squash "origin/${BRANCH}" >/dev/null
          if git diff --cached --quiet; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "分支没有实际改动，跳过"
          else
            git commit -m "$SUBJECT" --quiet
            git push origin main --quiet
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "已合并：$SUBJECT"
          fi
          git push origin --delete "$BRANCH" >/dev/null 2>&1 || true

      - name: 计算版本号
        if: steps.merge.outputs.merged == 'true'
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          prev=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          case "$prev" in
            v[0-9]*.[0-9]*.[0-9]*)
              rest=${prev#v}; major=${rest%%.*}; t=${rest#*.}; minor=${t%%.*}; patch=${t##*.}
              next="v${major}.${minor}.$((patch+1))" ;;
            *) next="v1.0.1" ;;
          esac
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: 发新版本（源码 tag，不含 exe）
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          next='${{ steps.ver.outputs.next }}'
          title='${{ steps.merge.outputs.title }}'
          gh release view "$next" >/dev/null 2>&1 && { echo "$next 已存在，跳过"; exit 0; }
          { echo "## 本次更新"; echo; echo "- $title"; echo;
            echo "源码包由 GitHub 自动生成；本次发行不含重新打包的 exe。"; } > /tmp/notes.md
          gh release create "$next" --target main --title "$next" --notes-file /tmp/notes.md </dev/null

      - name: 回复并关闭对应 issue
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          title='${{ steps.merge.outputs.title }}'
          marker="自动修复已合入 main"
          printf '%s' "$title" | grep -oE '#[0-9]+' | tr -d '#' | sort -un > /tmp/issues.txt || true
          [ -s /tmp/issues.txt ] || { echo "标题里没有 issue 号，跳过回复"; exit 0; }
          while read -r n; do
            [ -z "$n" ] && continue
            gh issue comment "$n" --body "$marker，改动已随自动版本发布，本 issue 一并关闭。" </dev/null || true
            gh issue close "$n" --reason completed </dev/null || true
          done < /tmp/issues.txt
